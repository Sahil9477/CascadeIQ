[project]
name = "cascadeiq"
version = "0.1.0"
description = "CascadeIQ — AI + deterministic resilience audit"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "openai>=3.51,<4",
  "python-dotenv>=1.2.4",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cascadeiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
